[project]
name = "uae-document-intelligence-agent"
version = "1.0.0"
description = "Bilingual (Arabic + English) document AI agent for UAE invoices, trade licences and tenancy contracts"
authors = [{ name = "Vineetha Susan Alexander" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
# essential checks: syntax errors and undefined names
select = ["E9", "F63", "F7", "F82"]
